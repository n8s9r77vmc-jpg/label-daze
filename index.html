<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Label Daze</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <h1>Label Daze</h1>
    <p class="tagline">Quickly save & manage product labels, allergens, and dates</p>
  </header>

  <main class="container">
    <section id="auth-section" class="card">
      <div id="user-info" class="hide">
        <p id="welcome"></p>
        <button id="sign-out" class="btn">Sign out</button>
      </div>

      <form id="sign-up-form" class="auth-form">
        <h2>Create account</h2>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button type="submit" class="btn">Sign up</button>
      </form>

      <form id="sign-in-form" class="auth-form">
        <h2>Sign in</h2>
        <input type="email" id="signin-email" placeholder="Email" required>
        <input type="password" id="signin-password" placeholder="Password" required>
        <button type="submit" class="btn">Sign in</button>
      </form>

      <div id="auth-message" class="muted"></div>
    </section>

    <section id="product-section" class="card hide">
      <h2>Add / Edit Product</h2>
      <form id="product-form">
        <label>
          Name
          <input type="text" id="product-name" required>
        </label>

        <label>
          Ingredients (comma separated)
          <input type="text" id="product-ingredients">
        </label>

        <label>
          Allergens
          <div id="allergens-list" class="chip-list"></div>
        </label>

        <label>
          Labels
          <div id="labels-list" class="chip-list"></div>
        </label>

        <label>
          Best before
          <input type="date" id="best-before">
        </label>

        <label>
          Notes
          <textarea id="product-notes" rows="2"></textarea>
        </label>

        <input type="hidden" id="editing-id">
        <div class="form-actions">
          <button type="submit" class="btn primary">Save product</button>
          <button type="button" id="product-clear" class="btn">Clear</button>
        </div>
      </form>

      <h3>Your products</h3>
      <ul id="product-list" class="list"></ul>
    </section>

  </main>

  <footer class="site-footer">
    <small>Built with Firebase · Mobile-first · Label Daze</small>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
